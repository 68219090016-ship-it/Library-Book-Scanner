<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Book Scanner System</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f8;

            color: #333;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            background: #2563eb;

            color: white;

            text-align: center;

            padding: 25px 15px;
        }


        header h1 {

            margin: 0 0 8px;

            font-size: 30px;
        }


        header p {

            margin: 0;

            font-size: 16px;
        }


        /* =========================
           MAIN
        ========================= */

        main {

            max-width: 900px;

            margin: 25px auto;

            padding: 15px;
        }


        /* =========================
           BOX
        ========================= */

        .box {

            background: white;

            padding: 20px;

            margin-bottom: 20px;

            border-radius: 15px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);
        }


        h2 {

            color: #2563eb;

            margin-top: 0;
        }


        /* =========================
           CAMERA
        ========================= */

        #reader {

            width: 100%;

            max-width: 500px;

            margin: auto;
        }


        #switchCamera {

            display: block;

            margin: 15px auto;

            padding: 12px 25px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        #switchCamera:hover {

            background: #1d4ed8;
        }


        #scan-result {

            text-align: center;

            font-weight: bold;

            margin-top: 15px;
        }


        /* =========================
           BOOK INFORMATION
        ========================= */

        .book-info {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }


        label {

            font-weight: bold;

            margin-bottom: 5px;

            display: block;
        }


        input {

            width: 100%;

            padding: 11px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }


        input:focus {

            outline: none;

            border-color: #2563eb;
        }


        /* =========================
           SAVE BUTTON
        ========================= */

        #saveButton {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            background: #16a34a;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;
        }


        #saveButton:hover {

            background: #15803d;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            padding: 20px;

            color: #666;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .book-info {

                grid-template-columns: 1fr;
            }


            header h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            📚 ระบบห้องสมุด
        </h1>

        <p>
            สแกนบาร์โค้ด ISBN
            เพื่อค้นหาข้อมูลหนังสือ
        </p>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <!-- =========================
             CAMERA SECTION
        ========================= -->

        <section class="box">

            <h2>
                📷 สแกนบาร์โค้ดหนังสือ
            </h2>


            <div id="reader"></div>


            <button id="switchCamera">

                🔄 สลับกล้อง

            </button>


            <p id="scan-result">

                กรุณาสแกนบาร์โค้ดหนังสือ

            </p>

        </section>



        <!-- =========================
             BOOK INFORMATION
        ========================= -->

        <section class="box">

            <h2>
                📖 ข้อมูลหนังสือ
            </h2>


            <div class="book-info">


                <!-- ISBN -->

                <div>

                    <label>
                        ISBN
                    </label>

                    <input
                        type="text"
                        id="isbn"
                        readonly
                    >

                </div>



                <!-- TITLE -->

                <div>

                    <label>
                        ชื่อหนังสือ
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="ชื่อหนังสือ"
                    >

                </div>



                <!-- AUTHOR -->

                <div>

                    <label>
                        ผู้แต่ง
                    </label>

                    <input
                        type="text"
                        id="author"
                        placeholder="ผู้แต่ง"
                    >

                </div>



                <!-- PUBLISHER -->

                <div>

                    <label>
                        สำนักพิมพ์
                    </label>

                    <input
                        type="text"
                        id="publisher"
                        placeholder="สำนักพิมพ์"
                    >

                </div>



                <!-- YEAR -->

                <div>

                    <label>
                        ปีที่พิมพ์
                    </label>

                    <input
                        type="text"
                        id="year"
                        placeholder="ปีที่พิมพ์"
                    >

                </div>



                <!-- PRICE -->

                <div>

                    <label>
                        ราคา
                    </label>

                    <input
                        type="text"
                        id="price"
                        placeholder="ราคา"
                    >

                </div>



                <!-- PAGES -->

                <div>

                    <label>
                        จำนวนหน้า
                    </label>

                    <input
                        type="text"
                        id="pages"
                        placeholder="จำนวนหน้า"
                    >

                </div>



                <!-- CATEGORY -->

                <div>

                    <label>
                        หมวดหมู่
                    </label>

                    <input
                        type="text"
                        id="category"
                        placeholder="หมวดหมู่"
                    >

                </div>


            </div>



            <!-- SAVE -->

            <button id="saveButton">

                💾 บันทึกข้อมูล

            </button>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        ระบบห้องสมุดโรงเรียน © 2026

    </footer>



    <!-- =========================
         HTML5 QR CODE
    ========================= -->

    <script
        src="https://unpkg.com/html5-qrcode">
    </script>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="script.js"></script>


</body>

</html>
