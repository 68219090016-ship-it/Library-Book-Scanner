<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Book Scanner System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #2563eb;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #scan-result {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .book-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        #saveButton {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        #saveButton:hover {
            background: #15803d;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 600px) {

            .book-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>📚 ระบบห้องสมุด</h1>

    <p>
        สแกนบาร์โค้ด ISBN เพื่อค้นหาข้อมูลหนังสือ
    </p>

</header>


<main>


    <!-- ===================== -->
    <!-- ระบบสแกน -->
    <!-- ===================== -->

    <section class="box">

        <h2>📷 สแกนบาร์โค้ดหนังสือ</h2>

        <div id="reader"></div>

        <p id="scan-result">
            กรุณาสแกนบาร์โค้ดหนังสือ
        </p>

    </section>


    <!-- ===================== -->
    <!-- ข้อมูลหนังสือ -->
    <!-- ===================== -->

    <section class="box">

        <h2>📖 ข้อมูลหนังสือ</h2>


        <div class="book-info">


            <div>

                <label>ISBN</label>

                <input
                    type="text"
                    id="isbn"
                    readonly
                >

            </div>


            <div>

                <label>ชื่อหนังสือ</label>

                <input
                    type="text"
                    id="title"
                >

            </div>


            <div>

                <label>ผู้แต่ง</label>

                <input
                    type="text"
                    id="author"
                >

            </div>


            <div>

                <label>สำนักพิมพ์</label>

                <input
                    type="text"
                    id="publisher"
                >

            </div>


            <div>

                <label>ปีที่พิมพ์</label>

                <input
                    type="text"
                    id="year"
                >

            </div>


            <div>

                <label>ราคา</label>

                <input
                    type="text"
                    id="price"
                >

            </div>


            <div>

                <label>จำนวนหน้า</label>

                <input
                    type="text"
                    id="pages"
                >

            </div>


            <div>

                <label>หมวดหมู่</label>

                <input
                    type="text"
                    id="category"
                >

            </div>


        </div>


        <button id="saveButton">
            💾 บันทึกข้อมูล
        </button>


    </section>


</main>


<footer>

    ระบบห้องสมุดโรงเรียน © 2026

</footer>


<!-- ===================== -->
<!-- Library สแกนบาร์โค้ด -->
<!-- ===================== -->

<script src="https://unpkg.com/html5-qrcode"></script>


<!-- ===================== -->
<!-- JavaScript ของเรา -->
<!-- ===================== -->

<script src="script.js"></script>


</body>

</html>
