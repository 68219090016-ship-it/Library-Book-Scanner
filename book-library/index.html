<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนหนังสือ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 ระบบห้องสมุด</h1>
        <p>สแกนบาร์โค้ดเพื่อค้นหาข้อมูลหนังสือ</p>
    </header>

    <main>

        <section class="scanner-box">

            <h2>📷 สแกนบาร์โค้ดหนังสือ</h2>

            <div id="reader"></div>

            <p id="scan-result">
                กรุณาสแกนบาร์โค้ดหนังสือ
            </p>

        </section>

        <section class="book-box">

            <h2>📖 ข้อมูลหนังสือ</h2>

            <div class="book-info">

                <div>
                    <label>ISBN</label>
                    <input type="text" id="isbn" readonly>
                </div>

                <div>
                    <label>ชื่อหนังสือ</label>
                    <input type="text" id="title">
                </div>

                <div>
                    <label>ผู้แต่ง</label>
                    <input type="text" id="author">
                </div>

                <div>
                    <label>สำนักพิมพ์</label>
                    <input type="text" id="publisher">
                </div>

                <div>
                    <label>ปีที่พิมพ์</label>
                    <input type="text" id="year">
                </div>

                <div>
                    <label>ราคา</label>
                    <input type="text" id="price">
                </div>

                <div>
                    <label>จำนวนหน้า</label>
                    <input type="text" id="pages">
                </div>

                <div>
                    <label>หมวดหมู่</label>
                    <input type="text" id="category">
                </div>

            </div>

            <button id="saveButton">💾 บันทึกข้อมูล</button>

        </section>

    </main>

    <footer>
        <p>ระบบห้องสมุดโรงเรียน © 2026</p>
    </footer>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>

</body>
</html>
